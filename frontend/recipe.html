<!doctype html>
<html lang="en" class="h-full bg-white dark:bg-gray-900">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robustly Many Items</title>
  </head>
  <body class="h-full">
    <nav
      class="fixed w-full bg-white shadow-sm dark:bg-gray-800 dark:shadow-none dark:after:pointer-events-none dark:after:absolute dark:after:inset-x-0 dark:after:bottom-0 dark:after:h-px dark:after:bg-white/10"
    >
      <div class="mx-auto max-w-7xl px-8">
        <div class="flex h-16 justify-between">
          <div class="flex px-0">
            <div class="flex shrink-0 items-center">
              <img src="/favicon.png" class="h-8 w-auto" />
            </div>
            <div class="ml-6 flex space-x-8">
              <a
                href="/"
                class="inline-flex items-center border-b-2 border-transparent px-1 pt-1 text-sm font-medium text-gray-500 hover:border-gray-300 hover:text-gray-700 dark:text-gray-400 dark:hover:border-white/20 dark:hover:text-white"
                >Chemicals</a
              >
              <a
                href="#"
                class="inline-flex items-center border-b-2 border-indigo-600 px-1 pt-1 text-sm font-medium text-gray-900 dark:border-indigo-500 dark:text-white"
                >Synthesis</a
              >
            </div>
          </div>
          <div class="flex flex-1 items-center px-2 ml-6 justify-end">
            <div class="grid w-full grid-cols-1 max-w-xs">
              <input
                type="search"
                id="search"
                placeholder="Search"
                autocomplete="off"
                class="col-start-1 row-start-1 block w-full rounded-md bg-white py-1.5 pr-3 pl-10 text-gray-900 outline-1 -outline-offset-1 outline-gray-300 placeholder:text-gray-400 focus:outline-2 focus:-outline-offset-2 focus:outline-indigo-600 text-sm/6 dark:bg-white/5 dark:text-white dark:outline-white/10 dark:placeholder:text-gray-500 dark:focus:outline-indigo-500"
              />
              <svg
                viewBox="0 0 20 20"
                fill="currentColor"
                data-slot="icon"
                aria-hidden="true"
                class="pointer-events-none col-start-1 row-start-1 ml-3 size-5 self-center text-gray-400"
              >
                <path
                  d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z"
                  clip-rule="evenodd"
                  fill-rule="evenodd"
                />
              </svg>
            </div>
            <ul id="search-results" class="search-results hidden"></ul>
          </div>
        </div>
      </div>
    </nav>
    <div
      class="fixed inset-y-0 z-50 flex w-108 flex-row dark:bg-gray-900 mt-16"
    >
      <div
        class="flex grow max-w-36 flex-col gap-y-5 overflow-y-auto border-r border-gray-200 bg-white px-6 py-4 dark:border-white/10 dark:bg-black/10"
      >
        <nav class="flex flex-1 flex-col">
          <ul role="list" id="groups" class="-mx-2 space-y-1"></ul>
        </nav>
      </div>
      <div
        class="flex grow max-w-72 flex-col gap-y-5 overflow-y-auto border-r border-gray-200 bg-white px-6 py-4 dark:border-white/10 dark:bg-black/10"
      >
        <nav class="flex flex-1 flex-col">
          <ul role="list" id="chemicals" class="-mx-2 space-y-1"></ul>
        </nav>
      </div>
    </div>
    <main class="pl-108 pt-16 w-full h-full">
      <div
        id="placeholder"
        class="p-8 dark:text-white w-full h-full flex items-center justify-center"
      >
        <h1 class="text-4xl font-semibold text-gray-600 dark:text-gray-500">
          Select a chemical
        </h1>
      </div>
      <div
        id="chem"
        class="p-8 pt-4 dark:text-white w-full h-full hidden flex-col gap-2 border-t-16"
      >
        <div
          class="flex items-center rounded-md bg-white px-3 outline-1 -outline-offset-1 outline-gray-300 focus-within:outline-2 focus-within:-outline-offset-2 focus-within:outline-indigo-600 dark:bg-white/5 dark:outline-white/10 dark:focus-within:outline-indigo-500"
        >
          <div
            id="amount-chem"
            class="shrink-0 text-base text-gray-800 select-none sm:text-sm/6 dark:text-gray-100"
          >
            sigynate
          </div>
          <input
            id="amount"
            type="text"
            placeholder="200"
            aria-describedby="amount-label"
            class="block min-w-0 grow bg-white py-1.5 pr-3 pl-1 text-base text-gray-900 placeholder:text-gray-400 focus:outline-none sm:text-sm/6 dark:bg-transparent dark:text-white dark:placeholder:text-gray-500"
          />
          <div
            id="amount-label"
            class="shrink-0 text-base text-gray-800 select-none sm:text-sm/6 dark:text-gray-100"
          >
            u
          </div>
        </div>
        <h1 class="text-xl font-semibold my-3">Ingredients</h1>
        <ul id="ingredients"></ul>
        <section id="leftovers-section">
          <h1 class="text-xl font-semibold my-3">Leftovers</h1>
          <ul id="leftovers"></ul>
        </section>
        <h1 class="text-xl font-semibold my-3">Steps</h1>
        <ul id="steps"></ul>
      </div>
    </main>
    <script type="module" src="/src/recipe.ts"></script>
  </body>
</html>
